<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fundamentos de la Restauración · Instituto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
  </head>
  <body>
    <script>
      document.documentElement.style.setProperty(
        "--font-body",
        '"Nunito Sans", "Avenir Next", sans-serif'
      );
      document.documentElement.style.setProperty(
        "--font-display",
        '"Nunito Sans", "Avenir Next", sans-serif'
      );
    </script>
    <main class="home home-gallery">
      <header class="home-intro">
        <div class="eyebrow">Religión 225 · Instituto</div>
        <h1>Fundamentos de la Restauración</h1>
        <p>
          Elige la clase. En la laptop abre <strong>TV / alumnos</strong> y
          transmite al televisor. En el celular abre <strong>maestro</strong>
          para el guion. Flechas ← → también avanzan.
        </p>
      </header>
      <div class="class-grid" data-class-grid></div>
    </main>
    <script src="data/catalog.js"></script>
    <script>
      (() => {
        const grid = document.querySelector("[data-class-grid]");
        if (!grid || !window.CLASS_CATALOG) return;
        grid.innerHTML = CLASS_CATALOG.map(
          (c, i) => `
        <article class="class-card${i === 0 ? " featured" : ""}">
          <div class="class-card-body">
            <div class="eyebrow">${escapeHtml(c.lessons)} · ${c.durationMin} min</div>
            <h2>${escapeHtml(c.label)}</h2>
            <p>${escapeHtml(c.blurb)}</p>
            <div class="home-actions">
              <a class="btn btn-primary" href="clase.html?clase=${encodeURIComponent(
                c.id
              )}&vista=maestro">Maestro</a>
              <a class="btn btn-ghost" href="clase.html?clase=${encodeURIComponent(
                c.id
              )}&vista=alumnos">TV / alumnos</a>
            </div>
          </div>
        </article>`
        ).join("");

        function escapeHtml(str) {
          return String(str || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
        }
      })();
    </script>
  </body>
</html>
